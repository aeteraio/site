<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#ffffff" rx="18"/>
  <defs>
    <linearGradient id="grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="100%" stop-color="#4361ee" />
    </linearGradient>
  </defs>
  <g stroke="url(#grad-icon)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Hexagon -->
    <line x1="50" y1="15" x2="80" y2="32.5"/>
    <line x1="80" y1="32.5" x2="80" y2="67.5"/>
    <line x1="80" y1="67.5" x2="50" y2="85"/>
    <line x1="50" y1="85" x2="20" y2="67.5"/>
    <line x1="20" y1="67.5" x2="20" y2="32.5"/>
    <line x1="20" y1="32.5" x2="50" y2="15"/>
    
    <!-- Inner Cube Edges -->
    <line x1="50" y1="50" x2="50" y2="15"/>
    <line x1="50" y1="50" x2="80" y2="67.5"/>
    <line x1="50" y1="50" x2="20" y2="67.5"/>
  </g>
  <g fill="#ffffff" stroke="url(#grad-icon)" stroke-width="3">
    <circle cx="50" cy="15" r="5"/>
    <circle cx="80" cy="32.5" r="5"/>
    <circle cx="80" cy="67.5" r="5"/>
    <circle cx="50" cy="85" r="5"/>
    <circle cx="20" cy="67.5" r="5"/>
    <circle cx="20" cy="32.5" r="5"/>
    <circle cx="50" cy="50" r="6"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="100%" stop-color="#4361ee" />
    </linearGradient>
  </defs>
  <g stroke="url(#grad-icon)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Hexagon -->
    <line x1="50" y1="12" x2="83" y2="31"/>
    <line x1="83" y1="31" x2="83" y2="69"/>
    <line x1="83" y1="69" x2="50" y2="88"/>
    <line x1="50" y1="88" x2="17" y2="69"/>
    <line x1="17" y1="69" x2="17" y2="31"/>
    <line x1="17" y1="31" x2="50" y2="12"/>
    
    <!-- Inner Cube Edges (3 lines to form a solid cube) -->
    <line x1="50" y1="50" x2="50" y2="12"/>
    <line x1="50" y1="50" x2="83" y2="69"/>
    <line x1="50" y1="50" x2="17" y2="69"/>
  </g>
  <g fill="#ffffff" stroke="url(#grad-icon)" stroke-width="3">
    <circle cx="50" cy="12" r="4.5"/>
    <circle cx="83" cy="31" r="4.5"/>
    <circle cx="83" cy="69" r="4.5"/>
    <circle cx="50" cy="88" r="4.5"/>
    <circle cx="17" cy="69" r="4.5"/>
    <circle cx="17" cy="31" r="4.5"/>
    <circle cx="50" cy="50" r="5.5"/>
  </g>
</svg>
